[package]
name = "cockatiel_roll"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — chat-command dice roller (!roll d<n>), coin flip, and other tiny dice games"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "16120ab927d35c14baf059d5be7d5c6bb37d78bc" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
